## 架构决策（ADR 前置记录）
- D1: EasyTier 以 **git 依赖 easytier crate**（非 path/workspace），features 显式声明
- D2: Host 也用 **smoltcp 无 TUN**（no_tun=true + use_smoltcp=true），不依赖 wintun 驱动
- D3: 结构 = workspace：`crates/qomicex-connector`(lib) + `crates/qomicex-connector-cli`(bin)
- D4: 启动完成检测：轮询 `instance.is_ready()`（替代 C# 解析 stdout "listener added"）
- D5: 节点列表：`instance.route_snapshots()` → Route{peer_id, hostname, ipv4_addr}（替代 easytier-cli peer）
- D6: NodeId：`instance.peer_id()`；VirtualIp：node_snapshot/固定 ipv4（Host 固定 10.144.144.1，Guest DHCP）
- D7: 日志用 `log` crate + 可选 tracing（不强制 loggerFactory）；CLI 里 env_logger

