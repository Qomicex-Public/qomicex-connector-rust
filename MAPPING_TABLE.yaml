## 关键行为映射
- 端口扫描：TcpListener 试绑 (C# 从 1025 起递增) → tokio TcpListener::bind 依次尝试，失败回退 25000
- 等待启动：C# 30s 超时 + 2s 缓冲 → is_ready() 轮询 ≤30s + 2s 缓冲
- Guest 直连失败 → Stop → PortForwards=[tcp://127.0.0.1:{local}/{vip}:{port}] → 重启 → 10 次重试×3s
- MapMinecraftPort 转发模式：心跳停+断连+Stop+加 MC 转发+重启+重连+心跳重启
- 协议协商：body = 协议键 join('\0')，取交集
- PlayerProfilesList：JSON 数组，snake_case，kind="HOST"/"GUEST"
- player_ping 心跳：协商含 c:player_easytier_id 时带 easytier_id 字段
- ServerPort 响应：大端 u16；状态 32-63 抛"MC 服务器未启动"
- 未知协议 → status 255 + UTF8 "未知协议: {key}"
- 事件：C# event → Rust 用 tokio::sync::watch / broadcast（PlayersChanged、ConnectionLost、ClientDisconnected）

